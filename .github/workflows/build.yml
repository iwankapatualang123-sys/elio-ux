name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug dan release
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug assembleRelease 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -9 | while IFS= read -r line; do echo "::error::${line}"; done
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ElioUX-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      - name: Terbitkan APK sebagai Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk ElioUX-release.apk
          cp app/build/outputs/apk/debug/app-debug.apk ElioUX-debug.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ElioUX-release.apk ElioUX-debug.apk --title "Elio UX terbaru" --notes "APK hasil build otomatis Elio UX (Tema ELIO Neon & BMW M Sport Innova Reborn)" --target "${{ github.sha }}"
